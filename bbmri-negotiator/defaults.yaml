# Config for the Negotiator project. Where its services coincide with the bbmri
# project, it uses the same ports: run one project at a time.

images:
  # Focus 0.26 renamed the Custodian stratifier to "Custodian-specimen" before
  # Lens learned to read it: with 0.26+ both sites degrade to their fallback
  # collection and the handoff assertions fail. Pin both sites until a Lens
  # release reading the new name has shipped and the published Locator image
  # has picked it up.
  focus: samply/focus:0.25.1
  prism: main

services:
  # Ports 3000, 8090 and 4011 are baked into the fixtures' redirect URIs and
  # the tokens' issuer, so they must stay as they are.
  lens2:
    port: 3000
  negotiator-gateway:
    port: 8090
  negotiator-oidc:
    port: 4011
  prism:
    port: 28060
  proxy-biobank-a:
    port: 28082
  proxy-biobank-b:
    port: 28083
  blaze-biobank-a:
    port: 28090
  blaze-biobank-b:
    port: 28091
