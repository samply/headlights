# The OIDC mock infers the issuer it advertises -- and the issuer it insists incoming tokens
# carry -- from the Host header of each request. Tokens are minted for http://localhost:4011,
# because that is the only address the browser can use, and the browser talks to the mock
# directly. Negotiator, however, sits inside the Docker network, where every route to the mock
# presents a different Host: directly as negotiator-oidc:4011, or -- the route Negotiator used
# before this proxy existed -- as host.docker.internal:4011, which the mock rejected with
# IDX10205 ("Issuer: 'http://localhost:4011'. Did not match: 'http://host.docker.internal:4011'").
# Pinning Host to the issuer the tokens actually carry makes Negotiator's introspection and
# key fetches agree with issuance.
server {
    listen 8080;

    location / {
        proxy_pass http://negotiator-oidc:4011;
        proxy_set_header Host localhost:4011;
        proxy_set_header X-Forwarded-Host localhost:4011;
        proxy_set_header X-Forwarded-Proto http;
    }
}
