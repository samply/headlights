# Builds the headlights image once, runs every project's tests in it and, on
# pushes to the branch, publishes that same image to ghcr.io.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches breakage from the floating images the projects run
  schedule:
    - cron: "0 3 * * *"

env:
  IMAGE: ghcr.io/samply/headlights

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: |
          podman build -t headlights .
          podman save -o headlights.tar headlights

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: headlights.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Pulls private images such as lens3's from ghcr.io
      packages: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - dktk
          - bbmri
          - eucaim
          - siorgp
          - dhki
          - mnpoc
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load the image
        run: podman load -i headlights.tar

      - name: Log in to ghcr.io
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin --authfile auth.json <<<"${{ secrets.GITHUB_TOKEN }}"
          # The container's podman user has to read it
          chmod a+r auth.json

      - name: Start the stack
        run: |
          podman run -d --name stack \
            --device /dev/fuse --device /dev/net/tun \
            --security-opt label=disable --security-opt unmask=ALL \
            -v ./auth.json:/home/podman/.docker/config.json:ro \
            headlights "${{ matrix.project }}"

      - name: Test
        run: podman exec stack headlights "${{ matrix.project }}" test

      - name: Show the stack's logs
        if: failure()
        run: |
          podman exec stack headlights "${{ matrix.project }}" ps -a || true
          podman logs stack

  # One check that sums up the others, for a ruleset to require, so the ruleset
  # doesn't need updating when jobs or matrix entries change
  ci-passed:
    # Without always(), this job is skipped when a dependency fails, and GitHub
    # counts a skipped required check as passed.
    if: always()
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Push the tested image
        run: |
          podman load -i headlights.tar
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          podman push headlights "$IMAGE:${{ github.ref_name }}"

      - name: Delete images no tag points to anymore
        uses: actions/delete-package-versions@v5
        with:
          package-name: headlights
          package-type: container
          delete-only-untagged-versions: true
