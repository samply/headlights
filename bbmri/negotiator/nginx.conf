server {
    # The published port 1:1; see defaults.yaml.
    listen 8090;
    location /api/ {
        proxy_pass http://negotiator:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://negotiator-frontend:8080;
        proxy_set_header Host $http_host;
    }
}
